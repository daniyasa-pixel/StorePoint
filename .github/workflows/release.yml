name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.2.0)'
        required: true
        default: 'v1.0.2.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'StorePoint Release v1.0.2.0'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    name: Build & Release Expo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/pos-mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Mobile Dependencies
        working-directory: apps/pos-mobile
        run: npm ci

      - name: Run Pre-Release Validation (TypeCheck, Lint & Unit Tests)
        working-directory: apps/pos-mobile
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Prebuild Android Native Project (Expo CNG)
        working-directory: apps/pos-mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Prepare Android SDK & Keystore
        working-directory: apps/pos-mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Decoding production release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/my-upload-key.jks
          else
            echo "::warning::Release signing secrets not configured (KEYSTORE_BASE64 + STORE_PASSWORD). Falling back to debug keystore signing."
          fi

      - name: Build Signed Release APK (Primary Artifact)
        working-directory: apps/pos-mobile/android
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          APK_SRC="apps/pos-mobile/android/app/build/outputs/apk/release/app-release.apk"
          mkdir -p release-assets

          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "release-assets/StorePoint-${TAG}.apk"
            echo "✓ Release APK copied to release-assets/StorePoint-${TAG}.apk"
          else
            echo "::error::Release APK not found at $APK_SRC"
            find apps/pos-mobile/android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null || echo "(no APK files found)"
            exit 1
          fi

          cd release-assets
          for f in *.apk; do sha256sum "$f" > "$f.sha256"; done
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
          cd ..

      - name: Create & Push Release Tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "✓ Created and pushed tag: $TAG"
          else
            echo "Tag $TAG already exists, ensuring it is on the remote"
            git push origin "$TAG" 2>/dev/null || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/*
          body: |
            ### StorePoint Point of Sale & Inventory System (React Native Expo + HeroUI Native) 📱

            Pre-compiled standalone Android APK ready for direct installation on Android phones, tablets, and POS terminals.

            #### 📲 Quick Installation Guide:
            1. Download **`StorePoint-${{ github.event.inputs.tag_name || github.ref_name }}.apk`** from the **Assets** section below.
            2. Open the downloaded APK on your Android device.
            3. When prompted, select **Allow from this source** to proceed with installation.
            4. Launch StorePoint and complete the 2-step store setup wizard.

            *Verify SHA-256 checksums from `SHA256SUMS.txt`.*
