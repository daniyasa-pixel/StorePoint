name: Code Quality & Security Audit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-audit:
    name: Secret & Keystore Safety Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Secrets & Leak Prevention Audit
        run: |
          echo "Checking for accidental tracking of sensitive files or private keys..."
          LEAKED_KEYS=$(git ls-files | grep -E '\.(jks|keystore|pem|pk8|key)$' || true)
          if [ -n "$LEAKED_KEYS" ]; then
            echo "::error::Leaked key material found in git tracking: $LEAKED_KEYS"
            exit 1
          fi

          LEAKED_ENV=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$LEAKED_ENV" ]; then
            echo "::error::Active .env file found tracked in git: $LEAKED_ENV"
            exit 1
          fi

          echo "Zero leaked credentials or tracked keys detected. Security audit PASSED."

  pos-mobile-quality:
    name: Expo TypeScript, ESLint (<800 LOC) & Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/pos-mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: apps/pos-mobile
        run: npm ci

      - name: TypeScript Check, ESLint & Unit Tests
        working-directory: apps/pos-mobile
        run: |
          npm run typecheck
          npm run lint
          npm test
